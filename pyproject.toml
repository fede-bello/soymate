[project]
name = "soymate"
version = "0.1.0"
description = "SoyMate: pulse quality control from a single photo (Hack the Fork Paris 2026)"
requires-python = ">=3.12,<3.15"  # box runs 3.12, laptops 3.14
dependencies = [
    "boto3",
    "huggingface_hub",
    "ipykernel>=7.2.0",
    "jupyterlab>=4.0",
    "matplotlib>=3.10.9",
    "numpy>=2.5.4",
    # headless: the EC2 box has no libGL, and no code uses OpenCV windows
    "opencv-python-headless>=4.10",
    "openpyxl",
    "pandas>=3.0.2",
    "pillow>=12.2.0",
    "plotly",
    "pyarrow",
    "pyyaml>=6.0.3",
    "requests",
    "safetensors",
    "scikit-image",
    "scikit-learn",
    "scipy",
    "statsmodels",
    "streamlit",
    "torch",
    "torchvision",
    "tqdm",
    "transformers",
    # demo API (app/api)
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
seg = ["cellpose"]

[dependency-groups]
baseline = [
    "numpy>=2.5.4",
    "ultralytics>=8.4.194",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
