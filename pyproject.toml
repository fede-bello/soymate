[project]
name = "soymate"
version = "0.1.0"
description = "SoyMate dataset exploration"
requires-python = ">=3.14,<3.15"
dependencies = [
    "ipykernel>=7.2.0",
    "jupyterlab>=4.0",
    "matplotlib>=3.10.9",
    "pandas>=3.0.2",
    "pillow>=12.2.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
baseline = [
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "ultralytics>=8.4.194",
]
