# SoyMate demo: React build at /, FastAPI (systemd soymate-api, 127.0.0.1:8000) at /api/.
# Installed by deploy/deploy.sh as /etc/nginx/conf.d/soymate.conf. default_server takes every Host,
# so the stock server block in /etc/nginx/nginx.conf (server_name _) never answers.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name soymate localhost;

    root /var/www/soymate/current;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Hashed Vite assets never change: cache for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html (and anything unhashed) must be revalidated so a redeploy shows up at once.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 16m;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
